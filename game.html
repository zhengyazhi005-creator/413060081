<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠遊戲 - Whac-A-Mole</title>
    <style>
        :root {
            --hole-color: #5d4037;
            --mole-color: #a1887f;
            --grass-color: #8bc34a;
            --bg-color: #e3f2fd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .score-board, .timer-board {
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .game {
            width: 600px;
            height: 400px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            background-color: var(--grass-color);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .hole {
            position: relative;
            overflow: hidden;
            background-color: var(--hole-color);
            border-radius: 50% 50% 10% 10%;
            border: 4px solid #3e2723;
        }

        /* 泥土遮罩效果 */
        .hole::after {
            content: '';
            display: block;
            background: var(--hole-color);
            width: 100%;
            height: 20px;
            position: absolute;
            bottom: 0;
            z-index: 2;
        }

        .mole {
            background-color: var(--mole-color);
            width: 80%;
            height: 100%;
            position: absolute;
            bottom: -100%;
            left: 10%;
            border-radius: 50% 50% 0 0;
            transition: bottom 0.1s ease-out;
            cursor: pointer;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 15px;
        }

        /* 地鼠眼睛 */
        .mole::before, .mole::after {
            content: '';
            width: 10px;
            height: 10px;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: 25px;
        }
        .mole::before { left: 30%; }
        .mole::after { right: 30%; }

        /* 地鼠粉色鼻子 */
        .mole-nose {
            width: 12px;
            height: 8px;
            background: #f06292;
            border-radius: 50%;
            margin-top: 25px;
        }

        .hole.up .mole {
            bottom: 0;
        }

        .controls {
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #1b5e20;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #bdbdbd;
            cursor: not-allowed;
        }

        /* 打中效果 */
        .bonk {
            animation: shake 0.1s linear 2;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 2px) rotate(1deg); }
        }

        @media (max-width: 650px) {
            .game {
                width: 90vw;
                height: 90vw;
            }
        }
    </style>
</head>
<body>

    <h1>打地鼠大賽!</h1>

    <div class="stats">
        <div class="score-board">分數: <span id="score">0</span></div>
        <div class="timer-board">剩餘時間: <span id="timer">30</span>s</div>
    </div>

    <div class="game">
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
        <div class="hole"><div class="mole"><div class="mole-nose"></div></div></div>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.querySelector('#score');
        const timerBoard = document.querySelector('#timer');
        const startBtn = document.querySelector('#start-btn');
        const moles = document.querySelectorAll('.mole');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let countdown;
        let timeLeft = 30;

        // 產生隨機時間 (地鼠停留多久)
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        // 隨機選取一個洞，不與上次重複
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        // 地鼠冒出來
        function peep() {
            const time = randomTime(400, 1000); // 地鼠停留時間
            const hole = randomHole(holes);
            hole.classList.add('up');
            
            setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        // 開始遊戲
        function startGame() {
            scoreBoard.textContent = 0;
            timerBoard.textContent = 30;
            score = 0;
            timeLeft = 30;
            timeUp = false;
            startBtn.disabled = true;

            peep();
            
            // 倒數計時器
            countdown = setInterval(() => {
                timeLeft--;
                timerBoard.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timeUp = true;
                    startBtn.disabled = false;
                    alert('遊戲結束！你的得分是：' + score);
                }
            }, 1000);
        }

        // 打地鼠
        function bonk(e) {
            if(!e.isTrusted) return; // 防止腳本模擬點擊
            score += 10;
            this.parentNode.classList.remove('up');
            scoreBoard.textContent = score;

            // 加入震動視覺效果
            this.classList.add('bonk');
            setTimeout(() => this.classList.remove('bonk'), 100);
        }

        moles.forEach(mole => mole.addEventListener('click', bonk));

    </script>
</body>
</html>
